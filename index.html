<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROTA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROTA">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>

  /* ---------- Design tokens ---------- */
  :root {
    /* surfaces */
    --bg: #0B0D10;
    --shell: #14171C;
    --surface: #1A1E24;
    --surface-2: #1E232B;
    --border: #22262E;
    --border-2: #2E3540;
    /* text (contrast-checked on --surface) */
    --text: #F1F3F5;    /* 16.1:1 */
    --text-2: #9BA4B1;  /*  6.6:1 */
    --text-3: #838C9A;  /*  4.9:1 */
    /* accents */
    --push: #F2994A;
    --pull: #4FA8C9;
    --rest: #7C8B7A;
    --done: #4CD07D;
    --on-done: #0F1510;
    --beta: #A879E0;
    --beta-surface: #1E1A26;
    --beta-border: #4A3A63;
    --focus: #F1F3F5;
    /* spacing rhythm (4/8) */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 22px; --s6: 32px;
    /* radii */
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 28px;
    /* type */
    --f-display: "Barlow Condensed", "Oswald", -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* motion */
    --dur: 180ms;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; background: var(--bg);
    font-family: var(--f-body);
    font-size: 15px;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; justify-content: center; align-items: flex-start;
    padding:
      calc(var(--s4) + env(safe-area-inset-top))
      calc(var(--s3) + env(safe-area-inset-right))
      calc(var(--s3) + env(safe-area-inset-bottom))
      calc(var(--s3) + env(safe-area-inset-left));
  }
  .phone {
    width: 100%; max-width: 420px;
    background: var(--shell); border-radius: var(--r-xl);
    padding: var(--s5) var(--s4) var(--s4);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 600px;
    height: calc(100vh - var(--s4) - var(--s3));
    height: calc(100dvh - var(--s4) - var(--s3) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: 880px;
  }

  button {
    font-family: inherit; cursor: pointer; border: none; background: none;
    color: inherit; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease),
                border-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }

  /* Expand tap area to 44px without shifting visual bounds (hitSlop equivalent) */
  button.chip, .icon-btn, .nav, button.row-check, .video-link { position: relative; }
  button.chip::after, .icon-btn::after, .nav::after, button.row-check::after, .video-link::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    min-width: 44px; min-height: 44px; width: 100%; height: 100%;
  }

  .ico { display: block; flex-shrink: 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Header ---------- */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--s4); }
  .brand-row { display: flex; align-items: center; gap: var(--s2); }
  .brand-mark { color: var(--push); }
  .brand {
    font-family: var(--f-display); font-size: 27px; line-height: 1;
    letter-spacing: 2.5px; font-weight: 700;
  }
  .brand-sub { font-size: 11.5px; color: var(--text-2); margin-top: 3px; letter-spacing: 0.2px; }
  .chips { display: flex; gap: var(--s2); align-items: center; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-radius: 999px; padding: 8px 12px;
    font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--text-2);
  }
  .chip.beta-on { background: #2A2233; border-color: var(--beta); color: var(--beta); }
  .chip.beta-off { color: var(--text-3); }
  .chip.streak { color: var(--text); }
  .chip.streak .ico { color: var(--push); }

  /* ---------- Rhythm strip ---------- */
  .rhythm {
    display: flex; align-items: flex-end; justify-content: space-between;
    height: 40px; margin-bottom: var(--s5);
  }
  .rbar { width: 4px; border-radius: 2px; transition: height var(--dur) var(--ease); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface); border: 1.5px solid; border-radius: var(--r-lg);
    padding: var(--s4) var(--s4) 17px;
    margin-bottom: var(--s3); width: 100%; text-align: left; display: block;
  }
  .card:active { background: #1D2229; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s2); }
  .eyebrow {
    font-family: var(--f-display); font-size: 11.5px; letter-spacing: 1.6px;
    color: var(--text-2); font-weight: 600; text-transform: uppercase;
  }
  .date-sm { font-size: 12px; color: var(--text-2); }
  .card-main { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
  .day-type { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: 0.5px; }
  .day-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }
  .checkbox {
    width: 46px; height: 46px; border-radius: var(--r-md); border: 1.5px solid;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }

  .beta-card {
    width: 100%; background: var(--beta-surface); border: 1.5px solid var(--beta-border);
    border-radius: var(--r-md); padding: var(--s3) var(--s4); margin-bottom: var(--s3);
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    text-align: left; color: inherit;
  }
  .beta-card:active { background: #241E2E; }
  .beta-eyebrow {
    font-family: var(--f-display); font-size: 10.5px; letter-spacing: 1.5px;
    color: var(--beta); font-weight: 600; text-transform: uppercase;
  }
  .beta-title { font-size: 14.5px; font-weight: 600; margin-top: 3px; }
  .beta-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  /* ---------- Calendar ---------- */
  .cal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: var(--s3) var(--s3) var(--s2);
    flex-shrink: 0;
  }
  .spacer { flex: 1; min-height: var(--s2); }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s2); }
  .cal-month {
    font-family: var(--f-display); font-size: 15px; letter-spacing: 1px;
    font-weight: 600; text-transform: uppercase;
  }
  .nav {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: var(--r-sm);
    color: var(--text-2);
  }
  .nav:active { background: var(--surface-2); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .week div {
    text-align: center; font-size: 11px; color: var(--text-3);
    font-weight: 600; letter-spacing: 0.3px;
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cell {
    aspect-ratio: 1; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background-color var(--dur) var(--ease);
  }
  .cell:active { transform: scale(0.94); }
  .cell .tick { position: absolute; bottom: 3px; right: 3px; color: var(--on-done); display: block; }
  .cell .dot { position: absolute; bottom: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; }
  .cell.today { box-shadow: inset 0 0 0 1.5px #EDEFF2; }

  .save { height: 18px; text-align: center; margin-top: var(--s2); font-size: 11.5px; color: var(--text-3); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0; background: var(--shell);
    padding: var(--s5) var(--s4) var(--s4);
    display: flex; flex-direction: column;
  }
  .ov-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--r-sm);
    background: var(--surface-2); border: 1px solid var(--border-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2); text-decoration: none; flex-shrink: 0;
  }
  .icon-btn:active { background: #262C35; }
  .ov-date { font-size: 12px; color: var(--text-2); text-align: center; }
  .ov-type {
    font-family: var(--f-display); font-size: 21px; font-weight: 700;
    margin-top: 2px; text-align: center; letter-spacing: 0.4px;
  }

  .track { height: 3px; background: var(--border); border-radius: 2px; margin-top: var(--s3); overflow: hidden; }
  .fill { height: 100%; border-radius: 2px; transition: width 300ms var(--ease); }

  .prog-note { font-size: 12.5px; color: var(--text-2); margin-top: var(--s3); text-align: center; }
  .list {
    flex: 1; overflow-y: auto; margin-top: var(--s2);
    display: flex; flex-direction: column; gap: 7px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .list::-webkit-scrollbar { display: none; }
  .row {
    display: flex; align-items: center; gap: var(--s3);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--s2) var(--s3) var(--s2) var(--s2);
    width: 100%; text-align: left; color: inherit;
  }
  .row:active { background: #1D2229; }
  .row.done { border-color: rgba(76, 208, 125, 0.35); }
  .row.done .row-name { color: var(--text-2); }
  .thumb {
    width: 44px; height: 44px; border-radius: var(--r-sm);
    object-fit: cover; background: var(--border); flex-shrink: 0;
  }
  .row-name { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
  .row-muscle { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .row-spec { font-size: 12.5px; color: var(--text-2); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .row-check {
    width: 22px; height: 22px; border-radius: 50%; background: var(--done);
    color: var(--on-done); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .rest { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .rest-dot { width: 14px; height: 14px; border-radius: 50%; margin-bottom: var(--s3); }
  .rest-title { font-family: var(--f-display); font-size: 25px; font-weight: 700; margin-bottom: 6px; }
  .rest-sub { font-size: 13.5px; color: var(--text-2); max-width: 260px; line-height: 1.5; }

  /* ---------- Buttons ---------- */
  .footer { display: flex; gap: var(--s2); margin-top: var(--s3); }
  .btn-primary {
    flex: 1.4; border-radius: var(--r-md); padding: 15px 0;
    color: var(--shell); font-weight: 700; font-size: 14.5px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px;
  }
  .btn-secondary {
    flex: 1; border: 1.5px solid; border-radius: var(--r-md); padding: 15px 0;
    background: transparent; font-weight: 600; font-size: 13.5px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px;
  }

  /* ---------- Session ---------- */
  .sess-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .sess-muscle {
    font-family: var(--f-display); font-size: 12px; letter-spacing: 1.2px;
    font-weight: 600; text-transform: uppercase;
  }
  .sess-name-row { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .sess-name { font-family: var(--f-display); font-size: 23px; font-weight: 700; line-height: 1.15; }
  .stage {
    width: 190px; height: 190px; border-radius: var(--r-lg);
    border: 1px solid var(--border-2); margin-top: var(--s3);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: #F4F5F7; flex-shrink: 0;
  }
  .stage.empty { background: var(--surface-2); color: var(--text-2); font-size: 12px; }
  .stage img { width: 100%; height: 100%; object-fit: contain; }
  .video-link {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid; border-radius: var(--r-sm);
    padding: 8px 13px; font-size: 12px; font-weight: 600;
    text-decoration: none; margin-top: var(--s2);
  }
  .reps { font-size: 16.5px; margin-top: var(--s3); font-weight: 600; }
  .timer {
    font-family: var(--f-display); font-size: 46px; font-weight: 600;
    margin-top: var(--s3); font-variant-numeric: tabular-nums; line-height: 1;
    letter-spacing: 1px;
  }
  .timer-label {
    font-size: 11.5px; color: var(--text-2); margin-top: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .cue { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-top: var(--s3); max-width: 320px; }

  /* ---------- Finished ---------- */
  .done-circle {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto var(--s4); color: var(--on-done);
  }
  .done-title { font-family: var(--f-display); font-size: 25px; font-weight: 700; }
  .done-sub { font-size: 13.5px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
  .center { align-items: center; justify-content: center; }

  /* ---------- Reminder screen ---------- */
  .sub-box {
    width: 100%; height: 100px; margin-top: var(--s4);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-2); border-radius: var(--r-sm);
    font-size: 10px; padding: var(--s2); resize: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* ---------- Motion preference ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    button:active, .cell:active { transform: none; }
  }

  /* ---------- Small phones ---------- */
  @media (max-height: 700px) {
    .rhythm { height: 30px; margin-bottom: var(--s4); }
    .day-type { font-size: 30px; }
    .stage { width: 158px; height: 158px; }
    .timer { font-size: 40px; }
  }
</style>
</head>

/* ---------------- Date helpers ---------------- */
function sod(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }

  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate()+n); return x; }

}

/* ---------------- Reminders (push) ---------------- */
function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var raw = atob(base64);
  var arr = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function checkReminderStatus() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  navigator.serviceWorker.getRegistration().then(function (reg) {
    if (!reg) return;
    reg.pushManager.getSubscription().then(function (sub) {
      if (sub) { S.reminderOn = true; render(); }
    });
  });
}
async function enableReminders() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    alert("Push notifications aren't supported here. On iPhone: add ROTA to your Home Screen first (Share → Add to Home Screen), then open it from there — needs iOS 16.4+.");
    return;
  }
  try {
    var reg = await navigator.serviceWorker.register("./sw.js");
    var perm = await Notification.requestPermission();
    if (perm !== "granted") { alert("Notification permission was not granted."); return; }
    var appKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
    var existing = await reg.pushManager.getSubscription();
    if (existing) {
      var oldKey = existing.options && existing.options.applicationServerKey
        ? new Uint8Array(existing.options.applicationServerKey) : null;
      var same = oldKey && oldKey.length === appKey.length &&
        oldKey.every(function (v, i) { return v === appKey[i]; });
      if (!same) { await existing.unsubscribe(); existing = null; }
    }
    var sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: appKey
    });
    S.reminderOn = true;
    S.reminderSub = JSON.stringify(sub);
    S.screen = "reminder";
    render();
  } catch (e) {
    alert("Couldn't enable reminders: " + e.message);
  }
}

function load() {
  try {

    if (raw) {
      var p = JSON.parse(raw);

      S.completed = p.completed || {};
      S.progress = p.progress || {};
    }
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      anchor: S.anchor.toISOString(), completed: S.completed, progress: S.progress
    }));
    S.saved = "Saved";
    setTimeout(function () { S.saved = ""; render(); }, 900);
  } catch (e) {}
}

function doneIdsFor(k) { return (k && k !== "beta" && S.progress[k]) ? S.progress[k] : []; }
function exercisesFor(k) {
  if (k === "beta") return betaDay();
  var d = dateFromKey(k);
  return EX[typeFor(d)] || [];
}
function dateFromKey(k) {
  var p = k.split("-");
  return new Date(+p[0], +p[1]-1, +p[2]);
}

function toggleExercise(k, id) {
  if (k === "beta") return;
  var list = (S.progress[k] || []).slice();
  var i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1); else list.push(id);
  if (list.length) S.progress[k] = list; else delete S.progress[k];
  save(); render();
}
function markDoneEx(k, id) {
  if (k === "beta") return;
  var list = (S.progress[k] || []).slice();
  if (list.indexOf(id) < 0) { list.push(id); S.progress[k] = list; save(); }
}
function toggleDay(k) {
  if (S.completed[k]) delete S.completed[k]; else S.completed[k] = true;
  save(); render();
}
function streak() {
  var n = 0, c = TODAY;
  while (n < 400) {
    var t = typeFor(c);
    if (!(t === "Rest" || S.completed[key(c)])) break;
    n++; c = addDays(c, -1);
  }
  return n;
}

/* ---------------- Session ---------------- */
function startWorkout(k) {
  var list = exercisesFor(k).map(function (e) {
    if (S.beta && e.type === "timer") {
      var c = JSON.parse(JSON.stringify(e));
      c.duration = Math.min(c.duration, BETA_TIMER);
      return c;
    }
    return e;
  });
  if (!list.length) return;
  var done = doneIdsFor(k);
  var i = 0;
  for (var j = 0; j < list.length; j++) {
    if (done.indexOf(list[j].id) < 0) { i = j; break; }
    if (j === list.length - 1) i = 0;
  }
  var ex = list[i];
  S.session = {
    dayKey: k, list: list, i: i,
    left: ex.type === "timer" ? ex.duration : null,
    running: true
  };
  S.screen = "session";
  tick(); render();
}
function resetDay(k) {
  delete S.progress[k];
  save();
  startWorkout(k);
}
function nextExercise() {
  var s = S.session;
  markDoneEx(s.dayKey, s.list[s.i].id);
  s.i++;
  if (s.i >= s.list.length) {
    S.screen = "finished";
    stopTick(); render(); return;
  }
  var ex = s.list[s.i];
  s.left = ex.type === "timer" ? ex.duration : null;
  s.running = true;
  tick(); render();
}
function finishWorkout() {
  var s = S.session;
  if (s && s.dayKey !== "beta") { S.completed[s.dayKey] = true; save(); }
  S.session = null; S.screen = "home"; S.dayKey = null;
  stopTick(); render();
}
function stopTick() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function tick() {
  stopTick();
  var s = S.session;
  if (!s) return;
  var ex = s.list[s.i];
  if (ex.type !== "timer") return;
  timerHandle = setInterval(function () {
    if (!S.session || !S.session.running) return;
    S.session.left--;
    if (S.session.left <= 0) { nextExercise(); return; }
    var el = document.getElementById("timer");
    if (el) el.textContent = fmt(S.session.left);
  }, 1000);
}

function imgEl(ex, cls) {

    else { img.dataset.failed = "1"; img.style.display = "none"; if (img.parentNode) img.parentNode.classList.add("empty"); }
  };
  return img;
}

}

function renderSession() {
  var s = S.session, ex = s.list[s.i];
  var isBeta = (s.dayKey === "beta");
  var t = isBeta ? "Push" : typeFor(dateFromKey(s.dayKey));
  var m = META[t];
  var done = doneIdsFor(s.dayKey);
  var isDone = done.indexOf(ex.id) >= 0;

  var ov = el("div", "overlay");
  var h = el("div", "ov-head");
  var x = iconBtn("button", "icon-btn", "x", "Close workout", 18);
  x.onclick = function () { stopTick(); S.session = null; S.screen = "day"; render(); };
  h.appendChild(x);
  h.appendChild(el("div", "ov-date", (s.i + 1) + " / " + s.list.length));
  var link = iconBtn("a", "icon-btn", "external", "Open form video for " + ex.name, 16);
  link.href = yt(ex.name); link.target = "_blank"; link.rel = "noreferrer";
  h.appendChild(link);
  ov.appendChild(h);

  var tr = el("div", "track");
  tr.setAttribute("role", "progressbar");
  tr.setAttribute("aria-valuemin", "0");
  tr.setAttribute("aria-valuemax", String(s.list.length));
  tr.setAttribute("aria-valuenow", String(s.i + 1));
  tr.setAttribute("aria-label", "Exercise " + (s.i + 1) + " of " + s.list.length);
  var fl = el("div", "fill");
  fl.style.background = m.color;
  fl.style.width = (((s.i + 1) / s.list.length) * 100) + "%";
  tr.appendChild(fl);
  ov.appendChild(tr);

  var body = el("div", "sess-body");
  var mu = el("div", "sess-muscle", ex.muscle); mu.style.color = m.color;
  body.appendChild(mu);

  var nr = el("div", "sess-name-row");
  nr.appendChild(el("span", "sess-name", ex.name));
  if (!isBeta && isDone) {
    var chk = iconBtn("button", "row-check", "check", "Mark " + ex.name + " as not done", 13);
    chk.onclick = function () { toggleExercise(s.dayKey, ex.id); };
    nr.appendChild(chk);
  }
  body.appendChild(nr);

  var stage = el("div", "stage");
  var img = imgEl(ex, "");
  stage.appendChild(img);
  body.appendChild(stage);

  var vl = document.createElement("a");
  vl.className = "video-link"; vl.href = yt(ex.name); vl.target = "_blank"; vl.rel = "noreferrer";
  vl.appendChild(svg("play", 13));
  vl.appendChild(el("span", null, "Watch full video"));
  vl.style.borderColor = m.color + "66"; vl.style.color = m.color;
  body.appendChild(vl);

  if (ex.type === "timer") {
    var tm = el("div", "timer", fmt(s.left)); tm.id = "timer";
    body.appendChild(tm);
    body.appendChild(el("div", "timer-label", s.running ? "in progress" : "paused"));
  } else {
    body.appendChild(el("div", "reps", ex.sets + " sets \u00D7 " + ex.reps + " reps"));
  }
  body.appendChild(el("div", "cue", ex.cue));
  ov.appendChild(body);

  var f = el("div", "footer");
  if (ex.type === "timer") {
    var pz = el("button", "btn-secondary", s.running ? "Pause" : "Resume");
    pz.style.borderColor = m.color; pz.style.color = m.color;
    pz.onclick = function () { S.session.running = !S.session.running; render(); };
    f.appendChild(pz);
  }
  var cont = el("button", "btn-primary", "Continue \u2192");
  cont.style.background = m.color;
  cont.onclick = function () { nextExercise(); };
  f.appendChild(cont);
  ov.appendChild(f);

  app.appendChild(ov);
}

function renderFinished() {
  var isBeta = S.session && S.session.dayKey === "beta";
  var t = isBeta ? "Push" : typeFor(dateFromKey(S.session.dayKey));
  var m = META[t];
  var ov = el("div", "overlay center");
  var box = el("div"); box.style.textAlign = "center";
  var c = el("div", "done-circle");
  c.appendChild(svg("check", 32));
  c.style.background = isBeta ? "#A879E0" : DONE;
  box.appendChild(c);
  box.appendChild(el("div", "done-title", isBeta ? "Beta run finished" : "Workout complete"));
  box.appendChild(el("div", "done-sub", isBeta ? "Test only \u2014 nothing was saved." : "Logged as done. The day turns green."));
  var b = el("button", "btn-primary", "Done");
  b.style.background = isBeta ? "#A879E0" : m.color;
  b.style.margin = "22px auto 0"; b.style.maxWidth = "160px";
  b.onclick = function () { finishWorkout(); };
  box.appendChild(b);
  ov.appendChild(box);
  app.appendChild(ov);
}

function renderReminder() {
  var ov = el("div", "overlay");
  var h = el("div", "ov-head");
  var x = iconBtn("button", "icon-btn", "x", "Close", 18);
  x.onclick = function () { S.screen = "home"; render(); };
  h.appendChild(x);
  h.appendChild(el("div", "ov-date", "Daily reminder"));
  var sp = el("div"); sp.style.width = "34px"; h.appendChild(sp);
  ov.appendChild(h);

  var body = el("div", "sess-body");
  var bell = el("div", "rest-dot");
  bell.style.background = "#A879E0";
  body.appendChild(bell);
  body.appendChild(el("div", "sess-name", "Reminders enabled on this device"));
  body.appendChild(el("div", "cue",
    "One last step: copy the code below and paste it back to Claude in chat. That links this device to the daily 20:00 reminder."));
  var ta = document.createElement("textarea");
  ta.value = S.reminderSub || "";
  ta.readOnly = true;
  ta.className = "sub-box";
  ta.setAttribute("aria-label", "Push subscription code");
  body.appendChild(ta);
  ov.appendChild(body);

  var f = el("div", "footer");
  var cp = el("button", "btn-primary", "Copy code");
  cp.style.background = "#A879E0";
  cp.onclick = function () {
    ta.select();
    if (navigator.clipboard) navigator.clipboard.writeText(S.reminderSub || "").catch(function () {});
    else document.execCommand("copy");
    cp.textContent = "Copied!";
    setTimeout(function () { cp.textContent = "Copy code"; }, 1500);
  };
  f.appendChild(cp);
  ov.appendChild(f);

  app.appendChild(ov);
}

load();
checkReminderStatus();
render();
</script>
</body>
</html>
